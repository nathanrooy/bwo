[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bwo"
dynamic = ["version"]
description = "Black Widow Optimization"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "Nathan A. Rooy", email = "nathanrooy@gmail.com" },
]
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/nathanrooy/bwo"
Repository = "https://github.com/nathanrooy/bwo"

[tool.setuptools.packages.find]
include = ["bwo*"]

[tool.setuptools.dynamic]
version = { attr = "bwo.__about__.__version__" }

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "PIE", "RUF"]

